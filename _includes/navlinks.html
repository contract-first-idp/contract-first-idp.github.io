<nav class="post-navi" aria-label="Post navigation">
  {% if page.previous.url %}
    <a class="post-navi-item" href="{{ page.previous.url | relative_url }}">
      <span class="post-navi-label">Previous post</span>
      <strong>{{ page.previous.title }}</strong>
    </a>
  {% else %}
    <a class="post-navi-item" href="{{ "/archive.html" | relative_url }}">
      <span class="post-navi-label">Blog archive</span>
      <strong>Browse all posts</strong>
    </a>
  {% endif %}

  {% if page.next.url %}
    <a class="post-navi-item nav-next" href="{{ page.next.url | relative_url }}">
      <span class="post-navi-label">Next post</span>
      <strong>{{ page.next.title }}</strong>
    </a>
  {% else %}
    <a class="post-navi-item nav-next" href="{{ "/archive.html" | relative_url }}">
      <span class="post-navi-label">Blog archive</span>
      <strong>Browse all posts</strong>
    </a>
  {% endif %}
</nav>
