<!-- Site build date: {{ "now" | date: "%FT%T%z" }} -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/css/override.css" | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/favicon/apple-touch-icon.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/favicon/favicon-32x32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/favicon/favicon-16x16.png" | relative_url }}">
  <link rel="manifest" href="{{ "/favicon/site.webmanifest" | relative_url }}">
  <link rel="mask-icon" href="{{ "/favicon/safari-pinned-tab.svg" | relative_url }}" color="#37bfd1">
  <meta name="msapplication-TileColor" content="#181c23">
  <meta name="theme-color" content="#181c23">
  <meta name="color-scheme" content="dark">

  {% feed_meta %}

  {% if jekyll.environment == 'production' and site.google_analytics -%}
  {% include google-analytics.html %}
  {%- endif %}

  <link rel="stylesheet" href="{{ "/js/highlightjs/styles/github-dark.css" | relative_url }}">
  <script src="{{ "/js/highlightjs/highlight.min.js" | relative_url }}"></script>
  <script src="{{ "/js/highlightjs/languages/plaintext.min.js" | relative_url }}"></script>
  <script src="{{ "/js/highlightjs/languages/yaml.min.js" | relative_url }}"></script>
  <script src="{{ "/js/highlightjs/languages/typescript.min.js" | relative_url }}"></script>
  <script src="{{ "/js/highlightjs/languages/javascript.min.js" | relative_url }}"></script>
  <script>document.addEventListener('DOMContentLoaded', () => window.hljs && hljs.highlightAll());</script>
</head>
